[project]
name = "pcsx2-mcp"
version = "0.1.0"
description = "MCP server for PCSX2 GDB debugging, VM control, tracing, and dumps"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "psutil>=5.9",
]

[project.optional-dependencies]
xinput = [
    "vgamepad==0.2.0; platform_system == 'Windows'",
]

[project.scripts]
pcsx2-mcp = "pcsx2_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcsx2_mcp"]
